services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaim_api
    restart: always
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password123@host.docker.internal:5433/chaim-db?schema=public
      - REDIS_URL=redis://host.docker.internal:6379
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - JWT_SECRET=supersecretkey_chaim_backend_2026
      - JWT_EXPIRE_IN=7d
      - JWT_REFRESH_EXPIRE_IN=30d
      - BCRYPT_SALT_ROUND=10
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - APARTMENT_LISTING_FEE=100
      - REPORT_RENTED_FEE=50
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=bdc.anrul@gmail.com
      - EMAIL_FROM=bdc.anrul@gmail.com
      - EMAIL_PASS=${EMAIL_PASS}
